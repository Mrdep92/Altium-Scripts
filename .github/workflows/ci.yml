name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate required files exist
        run: |
          test -f Scripts/MainUnit.pas
          test -f Scripts/Utils.pas
          test -f Scripts/Project.PrjScript

      - name: Validate PrjScript references both units
        run: |
          grep -q 'MainUnit.pas' Scripts/Project.PrjScript
          grep -q 'Utils.pas'     Scripts/Project.PrjScript

      - name: Validate entry point Run exists
        run: |
          grep -qiE '^[[:space:]]*Procedure[[:space:]]+Run[[:space:]]*;' Scripts/MainUnit.pas

      - name: Validate DelphiScript syntax (Begin/End balance)
        run: |
          python - <<'PY'
          import re, sys, pathlib

          files = ["Scripts/MainUnit.pas", "Scripts/Utils.pas"]
          ok = True

          for f in files:
              text = pathlib.Path(f).read_text(encoding="utf-8", errors="ignore")
              # buang komentar { ... } dan // ...
              text = re.sub(r"\{.*?\}", "", text, flags=re.S)
              text = re.sub(r"//[^\n]*", "", text)

              begins = len(re.findall(r"\bBegin\b", text, flags=re.I))
              ends   = len(re.findall(r"\bEnd\b",   text, flags=re.I))

              print(f"{f}: Begin={begins} End={ends}")
              if begins != ends:
                  print(f"  -> MISMATCH pada {f}")
                  ok = False

          sys.exit(0 if ok else 1)
          PY
